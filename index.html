<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个轻量、安静的今日专注面板" />
    <title>微光 · 今日专注</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="shell">
      <nav>
        <a class="brand" href="#">微光<span>.</span></a>
        <span id="today" class="date"></span>
      </nav>

      <section class="hero">
        <p class="eyebrow">TODAY'S FOCUS</p>
        <h1>慢一点，<br /><em>把重要的事做好。</em></h1>
        <p class="intro">给今天留一小块安静的空间。写下一件最重要的事，然后从容开始。</p>
      </section>

      <section class="focus-card">
        <div class="card-copy">
          <span class="label">此刻最重要的事</span>
          <input id="focusInput" maxlength="60" placeholder="例如：完成产品首页的设计稿" autocomplete="off" />
        </div>
        <button id="startButton" type="button">开始专注 <span>→</span></button>
      </section>

      <section class="stats" aria-label="今日状态">
        <article><strong id="focusCount">0</strong><span>完成专注</span></article>
        <article><strong id="minutes">0</strong><span>累计分钟</span></article>
        <article><strong id="mood">平静</strong><span>今日状态</span></article>
      </section>

      <footer>Small steps, meaningful days.</footer>
    </main>
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
